aid: msc-cargo
name: MSC Mediterranean Shipping Company
description: >-
  MSC (Mediterranean Shipping Company) is a privately-held, family-owned global
  container shipping and logistics group headquartered in Geneva, Switzerland,
  founded in 1970 by Gianluigi Aponte and now led by CEO Soren Toft under the
  Aponte-Diamant family. MSC is the world's largest container shipping line by
  fleet size and capacity, operating roughly 900 cargo vessels with a combined
  intake of about 7 million TEU and controlling more than a fifth of global
  container capacity as of late 2025. The carrier offers a portfolio of digital
  shipment-management products through its myMSC e-business platform — including
  Instant Quote for online rate generation, online booking, electronic Bill of
  Lading and Sea Waybill issuance via eDocs, container Track & Trace, and the
  myMSC mobile app — and exposes a Direct Integrations program for shippers,
  freight forwarders, and NVOCCs that combines REST APIs and EDI message
  exchange. The MSC Developer Portal (developerportal.msc.com), hosted on
  Microsoft Azure API Management, publishes documentation and EDI message
  implementation guides for products such as the DCSA-aligned Track & Trace API
  (v1.2 and v2.2), Booking, Booking Confirmation (X12 301 / EDIFACT IFTMIN), and
  Shipping Instructions, alongside ANSI X12 and EDIFACT IFTMIN / IFTMBC / COPRAR
  reference documents. MSC also runs direct-integration partnerships with
  INTTRA, Infor Nexus, and CargoSmart. API and EDI access is not self-service:
  prospective integrators must submit a Direct Integration request, and fees
  may apply.
